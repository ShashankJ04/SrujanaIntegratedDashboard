{% extends "base_dashboards.html" %}
{% block title %}RBAC Admin{% endblock %}

{% block content %}
<div style="min-height:100vh; display:flex; flex-direction:column; padding:20px;">
  <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
    <span style="font-size:24px">⚙️</span>
    <h1 class="dash-page-title">RBAC Admin</h1>
    <input type="text" class="dash-input" id="rbacSearch" placeholder="Search users..." style="flex-grow:1; max-width:360px; margin-left:auto;">
  </div>

  <div id="rbacLoading" class="dash-loading-center"><div class="dash-spinner"></div></div>

  <div class="dash-table-wrap" id="rbacTableWrap" style="display:none;">
    <table class="dash-table" id="rbacTable">
      <thead>
        <tr>
          <th>Login</th>
          <th>Name</th>
          <th class="text-center">tools</th>
          <th class="text-center">preventive_maintenance</th>
          <th class="text-center">life_report</th>
          <th class="text-center">production</th>
          <th class="text-center">rm_variance</th>
          <th class="text-center">REPT</th>
          <th class="text-center">PM+</th>
          <th class="text-center">REPT+</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rbacTbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const DASH_KEYS = ['tools','preventive_maintenance','life_report','production','rm_variance','rept'];
  const PLUS_KEYS = ['preventive_maintenance','rept_plus'];
  let allUsers = [], rbacUsers = [];

  async function load() {
    document.getElementById('rbacLoading').style.display = 'flex';
    try {
      const [usersData, rbacData] = await Promise.all([
        apiFetch('/api/admin/users'),
        apiFetch('/api/admin/rbac'),
      ]);
      allUsers = usersData;
      rbacUsers = rbacData.users || [];
      renderTable();
    } catch(err) { showSnackbar(err.message); }
    document.getElementById('rbacLoading').style.display = 'none';
  }

  function getUserRBAC(userId) {
    const id = Number(userId);
    return rbacUsers.find(u => Number(u.userId) === id) || { access: [], plusAccess: [] };
  }

  function renderTable() {
    const search = document.getElementById('rbacSearch').value.toLowerCase();
    const filtered = allUsers.filter(u => {
      if (!search) return true;
      return u.login.toLowerCase().includes(search) || (u.firstName + ' ' + u.lastName).toLowerCase().includes(search);
    });

    const tbody = document.getElementById('rbacTbody');
    tbody.innerHTML = '';

    filtered.forEach(u => {
      const rbac = getUserRBAC(u.id);
      const tr = document.createElement('tr');

      let html = `<td class="fw-600">${u.login}</td><td>${u.firstName} ${u.lastName}</td>`;

      DASH_KEYS.forEach(key => {
        const checked = rbac.access.includes(key) ? 'checked' : '';
        html += `<td class="text-center"><input type="checkbox" ${checked} data-user="${u.id}" data-key="${key}" data-type="access" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;"></td>`;
      });

      // Plus access
      PLUS_KEYS.forEach(key => {
        const checked = rbac.plusAccess.includes(key) ? 'checked' : '';
        html += `<td class="text-center"><input type="checkbox" ${checked} data-user="${u.id}" data-key="${key}" data-type="plus" style="width:18px;height:18px;accent-color:var(--success);cursor:pointer;"></td>`;
      });

      html += `<td><button class="dash-btn dash-btn-primary dash-btn-sm" data-save="${u.id}">💾 Save</button></td>`;
      tr.innerHTML = html;
      tbody.appendChild(tr);

      // Save handler
      tr.querySelector('[data-save]').addEventListener('click', async () => {
        const access = []; const plusAccess = [];
        tr.querySelectorAll('input[data-type="access"]').forEach(cb => { if (cb.checked) access.push(cb.dataset.key); });
        tr.querySelectorAll('input[data-type="plus"]').forEach(cb => { if (cb.checked) plusAccess.push(cb.dataset.key); });
        try {
          await apiPut('/api/admin/rbac/' + u.id, { login: u.login, access, plusAccess });
          showSnackbar(`Saved permissions for ${u.login}`);
          // Refresh local cache
          const idx = rbacUsers.findIndex(r => r.userId === u.id);
          if (idx >= 0) { rbacUsers[idx].access = access; rbacUsers[idx].plusAccess = plusAccess; }
          else { rbacUsers.push({ userId: u.id, login: u.login, access, plusAccess }); }
        } catch(err) { showSnackbar(err.message); }
      });
    });

    document.getElementById('rbacTableWrap').style.display = 'block';
  }

  document.getElementById('rbacSearch').addEventListener('input', renderTable);
  load();
})();
</script>
{% endblock %}
