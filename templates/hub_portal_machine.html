<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Portal — Titanium Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/titanium.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background: #010409; margin:0; padding:0; font-family: 'Inter', sans-serif; color: var(--ti-text); }
        .portal-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background: radial-gradient(circle at top right, #1d4ed833, transparent), radial-gradient(circle at bottom left, #05966922, transparent); }
        .portal-container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .portal-header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .portal-machine-name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; color: #fff; }
        .portal-status-badge { display: inline-flex; align-items:center; gap:6px; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.05); border: 1px solid var(--ti-glass-border); }
        .portal-pulse { width:8px; height:8px; border-radius: 50%; background: var(--ti-emerald); animation: ti-pulse 2s infinite; }
        
        .portal-card { background: rgba(23, 27, 33, 0.7); backdrop-filter: blur(12px); border: 1px solid var(--ti-glass-border); border-radius: 24px; padding: 24px; margin-bottom: 20px; }
        .portal-card-title { font-size: 14px; font-weight: 700; color: var(--ti-text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
        
        .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .health-stat { text-align: center; }
        .health-value { font-size: 20px; font-weight: 700; color: #fff; display: block; }
        .health-label { font-size: 11px; color: var(--ti-text-dim); }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .portal-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--ti-surface-2); border: 1px solid var(--ti-glass-border); border-radius: 20px; padding: 20px; text-decoration: none; color: #fff; transition: all 0.2s; cursor: pointer; }
        .portal-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        .portal-btn i { font-size: 24px; }
        .portal-btn span { font-size: 13px; font-weight: 600; }
        
        #dial-container { width: 100%; height: 200px; margin-top: -30px; }
    </style>
</head>
<body>
    <div class="portal-bg"></div>
    <div class="portal-container">
        <div class="portal-header">
            <div id="p-machine-name" class="portal-machine-name">Loading...</div>
            <div class="portal-status-badge">
                <div class="portal-pulse"></div>
                <span id="p-status">Active Production</span>
            </div>
        </div>

        <!-- ═══ Digital Twin Health ═══ -->
        <div class="portal-card">
            <div class="portal-card-title">Tool Health & Life</div>
            <div id="dial-container"></div>
            <div class="health-grid">
                <div class="health-stat">
                    <span class="health-value" id="p-tool-no">–</span>
                    <span class="health-label">Active Tool</span>
                </div>
                <div class="health-stat">
                    <span class="health-value" id="p-tool-rem">–</span>
                    <span class="health-label">Strokes Left</span>
                </div>
            </div>
        </div>

        <!-- ═══ Active Job ═══ -->
        <div class="portal-card">
            <div class="portal-card-title">Active Job Progress</div>
            <div style="margin-bottom: 12px;">
                <span id="p-part-no" style="font-weight:700; color:#fff">Part No</span>
                <span id="p-part-name" style="display:block; font-size:12px; color:var(--ti-text-dim)">Part Name</span>
            </div>
            <div class="ti-monitor-progress" style="background: rgba(255,255,255,0.05); height: 12px; margin-bottom: 8px;">
                <div id="p-progress-bar" class="ti-monitor-bar" style="width: 0%; height: 100%; border-radius: 6px;"></div>
            </div>
            <div class="ti-flex-between">
                <span style="font-size:12px; color:var(--ti-text-dim)">Produced: <b id="p-produced" style="color:#fff">0</b></span>
                <span style="font-size:12px; color:var(--ti-text-dim)">Target: <b id="p-target" style="color:#fff">0</b></span>
            </div>
        </div>

        <!-- ═══ One-Tap Actions ═══ -->
        <div class="action-grid">
            <button class="portal-btn" id="btn-dpr">
                <span style="font-size:24px">📝</span>
                <span>Log Production</span>
            </button>
            <button class="portal-btn" id="btn-wh">
                <span style="font-size:24px">📦</span>
                <span>Request RM</span>
            </button>
        </div>
        
        <div style="text-align: center; margin-top: 30px; font-size: 11px; color: var(--ti-text-dim);">
            TITANIUM Unified Command Center &bull; {{ machine_id }}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/portal_machine.js') }}"></script>
    <script>
        window.MACHINE_ID = {{ machine_id }};
        window.API_BASE = "{{ url_for('index') }}";
    </script>
</body>
</html>
