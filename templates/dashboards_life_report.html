{% extends "base_dashboards.html" %}
{% block title %}Life Report{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height:100vh; overflow:hidden; padding:20px;">
  <div style="flex-shrink:0; margin-bottom:12px; display:flex; align-items:center; gap:16px;">
    <div>
      <h1 class="dash-page-title">Tool Life Report</h1>
      <p style="font-size:13px; color:var(--text-muted);" id="lifeSubtitle">Current lifetime strokes for all tools</p>
    </div>
    <div id="lifeFilterChip" style="display:none;"></div>
  </div>

  <div id="lifeLoading" class="dash-loading-center"><div class="dash-spinner"></div></div>

  <div style="display:flex; gap:12px; margin-bottom:12px; flex-shrink:0;" id="lifeSummary"></div>

  <div class="dash-table-wrap" id="lifeTableWrap" style="flex:1; min-height:0; display:none;">
    <table class="dash-table" id="lifeTable">
      <thead><tr>
        <th>Tool No</th><th class="text-right">Tool Life</th><th class="text-right">Lifetime Strokes</th>
        <th style="min-width:200px">Life Used</th><th class="text-right">%</th>
        <th style="min-width:180px">PM Progress</th><th class="text-right">PM %</th>
      </tr></thead>
      <tbody id="lifeTbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  let filter = params.get('filter'); // 'warning' | 'critical' | null

  async function load() {
    document.getElementById('lifeLoading').style.display = 'flex';
    try {
      const pmAll = await apiFetch('/api/pm/status?mode=all');

      // Summary
      const total = pmAll.length;
      const warnCount = pmAll.filter(t => { const p = t.toolLife > 0 ? Math.min(Math.round((t.totalLifetimeStrokes / t.toolLife) * 100), 100) : 0; return p >= 50 && p < 80; }).length;
      const critCount = pmAll.filter(t => { const p = t.toolLife > 0 ? Math.min(Math.round((t.totalLifetimeStrokes / t.toolLife) * 100), 100) : 0; return p >= 80; }).length;

      document.getElementById('lifeSummary').innerHTML = `
        <div class="dash-stat" style="background:#e3f2fd;border-color:#e3f2fd;"><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Total Tools</div><div class="dash-stat-value" style="color:#1565c0">${total}</div></div></div>
        <div class="dash-stat" style="background:#fff8e1;border-color:#fff8e1;"><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Life 50–80%</div><div class="dash-stat-value" style="color:#f9a825">${warnCount}</div></div></div>
        <div class="dash-stat" style="background:#fce4ec;border-color:#fce4ec;"><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Life ≥80%</div><div class="dash-stat-value" style="color:#d32f2f">${critCount}</div></div></div>
      `;

      // Filter
      let list = [...pmAll];
      if (filter === 'warning') list = list.filter(t => { const p = t.toolLife > 0 ? Math.min(Math.round((t.totalLifetimeStrokes / t.toolLife) * 100), 100) : 0; return p >= 50 && p < 80; });
      else if (filter === 'critical') list = list.filter(t => { const p = t.toolLife > 0 ? Math.min(Math.round((t.totalLifetimeStrokes / t.toolLife) * 100), 100) : 0; return p >= 80; });

      list.sort((a, b) => {
        const pa = a.toolLife > 0 ? (a.totalLifetimeStrokes / a.toolLife) * 100 : 0;
        const pb = b.toolLife > 0 ? (b.totalLifetimeStrokes / b.toolLife) * 100 : 0;
        return pb - pa;
      });

      // Filter chip
      const chipEl = document.getElementById('lifeFilterChip');
      if (filter) {
        chipEl.style.display = '';
        const label = filter === 'warning' ? 'Life 50–80%' : 'Life ≥80%';
        chipEl.innerHTML = `<span class="dash-chip ${filter === 'critical' ? 'dash-chip-danger' : 'dash-chip-warning'}">Filter: ${label} <button style="background:none;border:none;cursor:pointer;font-size:14px;margin-left:4px;" onclick="clearFilter()">×</button></span>`;
        document.getElementById('lifeSubtitle').textContent = 'Showing tools with ' + label;
      }

      // Table
      const tbody = document.getElementById('lifeTbody');
      tbody.innerHTML = '';

      list.forEach((entry) => {
        const pct = entry.toolLife > 0 ? Math.min(Math.round((entry.totalLifetimeStrokes / entry.toolLife) * 100), 100) : 0;
        const color = pct >= 80 ? '#d32f2f' : pct >= 50 ? '#ed6c02' : '#2e7d32';
        const pmRange = entry.nextStroke - entry.pmCurrentStroke;
        const pmPct = pmRange > 0 ? Math.round(((entry.totalLifetimeStrokes - entry.pmCurrentStroke) / pmRange) * 100) : 0;
        const pmColor = pmPct >= 80 ? '#d32f2f' : pmPct >= 50 ? '#ed6c02' : '#2e7d32';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${entry.toolNo}</strong></td>
          <td class="text-right">${formatIndianCompact(entry.toolLife)}</td>
          <td class="text-right">${formatIndianCompact(entry.totalLifetimeStrokes)}</td>
          <td><div style="display:flex;align-items:center;gap:8px;"><div class="dash-progress" style="height:10px;"><div class="dash-progress-bar" style="width:${pct}%;background:${color}"></div></div></div></td>
          <td class="text-right"><strong style="color:${color}">${pct}%</strong></td>
          <td>${pmRange > 0 ? `<div style="display:flex;align-items:center;gap:8px;"><div class="dash-progress" style="height:10px;"><div class="dash-progress-bar" style="width:${Math.min(pmPct,100)}%;background:${pmColor}"></div></div><span style="font-size:10px;white-space:nowrap;">${formatIndianCompact(entry.totalLifetimeStrokes - entry.pmCurrentStroke)}/${formatIndianCompact(pmRange)}</span></div>` : '<span style="color:var(--text-light)">—</span>'}</td>
          <td class="text-right">${pmRange > 0 ? `<strong style="color:${pmColor}">${pmPct}%</strong>` : '<span style="color:var(--text-light)">—</span>'}</td>
        `;
        tbody.appendChild(tr);
      });

      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">No tools found</td></tr>';
      }

      document.getElementById('lifeTableWrap').style.display = 'block';
    } catch(err) { showSnackbar(err.message); }
    document.getElementById('lifeLoading').style.display = 'none';
  }

  window.clearFilter = function() {
    filter = null;
    window.history.replaceState({}, '', '/dashboards/life-report');
    document.getElementById('lifeFilterChip').style.display = 'none';
    document.getElementById('lifeSubtitle').textContent = 'Current lifetime strokes for all tools';
    load();
  };

  load();
})();
</script>
{% endblock %}
