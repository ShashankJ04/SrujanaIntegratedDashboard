<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Report — Excel view</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css', v='corp-v2') }}"
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="header-left">
          <div class="brand">
            <img
              class="brand-mark"
              src="{{ url_for('static', filename='images/side-logo.png') }}"
              alt="Logo"
            />
            <div class="brand-text">
              <div class="brand-title-row">
                <h1 class="brand-title">Report</h1>
                <div class="brand-date-group">
                  <span id="header-date" class="brand-date"></span>
                  <button
                    id="hard-refresh-btn"
                    type="button"
                    class="icon-btn icon-btn--refresh"
                    title="Hard refresh dashboard data"
                  >
                    &#x27F3;
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="header-actions">
            <input
              id="global-search"
              class="global-search-input"
              type="search"
              placeholder="Global search…"
            />
            <button id="export-btn" class="primary-btn">Export to Excel</button>
          </div>
        </div>
        <nav class="header-nav">
          <a href="/dashboard" class="header-nav-link">Dashboard</a>
          <a href="/reports" class="header-nav-link header-nav-link--active">Report</a>
          <a href="/logout" class="header-nav-link header-nav-link--logout">Logout</a>
        </nav>
      </header>

      <main class="app-main">
        <section class="table-wrapper">
          <div id="table-container" class="table-container">
            <div class="placeholder">Loading data…</div>
          </div>
        </section>

        <section class="pagination-bar">
          <div class="pagination-left">
            <label class="control-label" for="page-size-select">
              Rows per page
              <select id="page-size-select" class="select-input">
                <option value="10">10</option>
                <option value="25" selected>{{ default_page_size }}</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">All</option>
              </select>
            </label>
          </div>
          <div class="pagination-center">
            <button id="first-page" class="ghost-btn" disabled>&laquo; First</button>
            <button id="prev-page" class="ghost-btn" disabled>&lsaquo; Prev</button>
            <span>Page</span>
            <input id="current-page-input" type="number" min="1" value="1" />
            <span id="total-pages-label">/ 1</span>
            <button id="next-page" class="ghost-btn" disabled>Next &rsaquo;</button>
            <button id="last-page" class="ghost-btn" disabled>Last &raquo;</button>
          </div>
          <div class="pagination-right">
            <span id="table-summary" class="summary-text">Loading…</span>
            <div class="zoom-controls">
              <span class="zoom-label">Zoom</span>
              <button type="button" id="zoom-out" class="zoom-btn">&minus;</button>
              <input
                id="zoom-range"
                class="zoom-range"
                type="range"
                min="50"
                max="150"
                value="100"
              />
              <button type="button" id="zoom-in" class="zoom-btn">+</button>
              <span id="zoom-display" class="zoom-display">100%</span>
            </div>
          </div>
        </section>
      </main>

      <footer class="app-footer"></footer>
    </div>

    <script>
      window.DASHBOARD_DEFAULT_PAGE_SIZE = {{ default_page_size|int }};
      window.DASHBOARD_MAX_PAGE_SIZE = {{ max_page_size|int }};
      window.BUFFER_EDIT_ALLOWED = {{ buffer_edit_allowed|tojson }};
      window.CURRENT_USER = {{ user|tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/table.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pagination.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
