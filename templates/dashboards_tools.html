{% extends "base_dashboards.html" %}
{% block title %}Tools Dashboard{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height:100vh; overflow:hidden; padding:20px;">
  <!-- Header -->
  <div style="flex-shrink:0; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h1 class="dash-page-title">Tool Management Dashboard</h1>
      <p style="font-size:13px; color:var(--text-muted);" id="toolsDate"></p>
    </div>
    <div style="display:flex; gap:12px; align-items:center; flex:1; justify-content:flex-end; margin-left:24px;" id="toolsStats"></div>
  </div>

  <!-- Loading -->
  <div id="toolsLoading" class="dash-loading-center" style="display:none;"><div class="dash-spinner"></div></div>

  <!-- Stat cards row -->
  <div style="display:flex; gap:12px; margin-bottom:12px; flex-shrink:0;" id="toolsStatCards"></div>

  <!-- 3-column layout -->
  <div class="dash-three-col" id="toolsColumns" style="display:none;">
    <!-- Today -->
    <div class="dash-column">
      <div class="dash-column-header" style="background:#1565c0;">
        <span>Today</span>
        <button class="dash-btn-icon" style="color:#fff;" id="todayReverseBtn" title="Toggle direction">▲</button>
      </div>
      <div class="dash-column-body" id="todayBody"></div>
    </div>
    <!-- Future -->
    <div class="dash-column">
      <div class="dash-column-header" style="background:#2e7d32; gap:8px;">
        <button class="dash-btn-icon" style="color:#fff;" id="futureBackBtn">◀</button>
        <span id="futureLabel">Tomorrow</span>
        <button class="dash-btn-icon" style="color:#fff;" id="futureNextBtn">▶</button>
      </div>
      <div class="dash-column-body" id="futureBody"></div>
    </div>
    <!-- Maintenance -->
    <div class="dash-column">
      <div class="dash-column-header" style="background:#e65100;">
        <span>Maintenance Required</span>
      </div>
      <div class="dash-column-body scrollable" id="maintBody"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  let futureOffset = 1;
  let todayReverse = false;
  const todayBody = document.getElementById('todayBody');
  const futureBody = document.getElementById('futureBody');
  const maintBody = document.getElementById('maintBody');
  const futureLabel = document.getElementById('futureLabel');
  const loading = document.getElementById('toolsLoading');
  const columns = document.getElementById('toolsColumns');
  const statCards = document.getElementById('toolsStatCards');
  const statsBar = document.getElementById('toolsStats');

  function dateOffset(days) {
    const d = new Date(); d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }

  function offsetLabel(o) {
    if (o === 1) return 'Tomorrow';
    if (o === 2) return 'Day After';
    return new Date(dateOffset(o) + 'T00:00:00').toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric' });
  }

  function flattenTools(tools) {
    const flat = [];
    (tools || []).forEach(t => {
      (t.machines || []).forEach(m => {
        flat.push({ ...t, machineId: m.machineId, machineName: m.machineName, scheduledQty: m.scheduledQty, scheduledStrokes: m.scheduledStrokes });
      });
    });
    return flat;
  }

  function makeToolCard(entry, pmByToolNo) {
    const pm = pmByToolNo.get(entry.toolNo);
    const hasPM = !!pm;
    const pmPct = pm ? pm.pmPercentage : 0;
    const lifePct = hasPM && pm.toolLife > 0 ? Math.min(Math.round((pm.totalLifetimeStrokes / pm.toolLife) * 100), 100) : 0;
    const pmRange = hasPM ? pm.nextStroke - pm.pmCurrentStroke : 0;
    const projPct = hasPM && pmRange > 0 ? Math.round(((pm.totalLifetimeStrokes + entry.scheduledStrokes - pm.pmCurrentStroke) / pmRange) * 100) : 0;
    const willCross = hasPM && projPct >= 100;
    const willWarn = hasPM && projPct >= 80 && !willCross;

    const cls = willCross ? 'dash-tool-card blink-danger' : willWarn ? 'dash-tool-card warning-border' : 'dash-tool-card';
    const pmBarColor = pmPct >= 80 ? '#d32f2f' : pmPct >= 50 ? '#ed6c02' : '#2e7d32';
    const lifeBarColor = lifePct >= 80 ? '#d32f2f' : lifePct >= 50 ? '#ed6c02' : '#2e7d32';

    const el = document.createElement('div');
    el.className = cls;

    let barsHtml = '';
    if (hasPM) {
      const pmVal = pm.totalLifetimeStrokes - pm.pmCurrentStroke;
      const pmMax = pm.nextStroke - pm.pmCurrentStroke;
      barsHtml = `<div class="dash-mini-bars">
        <div class="dash-mini-bar"><div class="dash-mini-bar-header"><span class="dash-mini-bar-label">PM</span><span class="dash-mini-bar-value">${formatIndianCompact(pmVal)}/${formatIndianCompact(pmMax)} (${pmPct}%)</span></div><div class="dash-mini-bar-track"><div class="dash-mini-bar-fill" style="width:${Math.min(pmPct,100)}%;background:${pmBarColor}"></div></div></div>
        <div class="dash-mini-bar"><div class="dash-mini-bar-header"><span class="dash-mini-bar-label">Life</span><span class="dash-mini-bar-value">${formatIndianCompact(pm.totalLifetimeStrokes)}/${formatIndianCompact(pm.toolLife)} (${lifePct}%)</span></div><div class="dash-mini-bar-track"><div class="dash-mini-bar-fill" style="width:${Math.min(lifePct,100)}%;background:${lifeBarColor}"></div></div></div>
      </div>`;
    } else {
      barsHtml = `<div class="dash-mini-bars"><div class="dash-mini-bar"><span class="dash-mini-bar-label">PM</span> <span style="font-weight:700;font-size:11px">∞</span></div><div class="dash-mini-bar"><span class="dash-mini-bar-label">Life</span> <span style="font-weight:700;font-size:11px">∞</span></div></div>`;
    }

    el.innerHTML = `
      <div class="dash-tool-row">
        <span class="dash-tool-no">${entry.toolNo}</span>
        <span style="flex:1"></span>
        <span class="dash-tool-machine">${entry.machineName}</span>
        <span class="dash-tool-qty">${formatIndianCompact(entry.scheduledQty)}</span>
      </div>
      <div class="dash-tool-part">${entry.partName} <span>(${entry.partNo})</span></div>
      ${barsHtml}
    `;
    return el;
  }

  function makeMaintCard(entry) {
    const isCritical = entry.pmPercentage >= 100;
    const barColor = isCritical ? '#d32f2f' : '#ed6c02';
    const lifePct = entry.toolLife > 0 ? Math.min(Math.round((entry.totalLifetimeStrokes / entry.toolLife) * 100), 100) : 0;
    const lifeBar = lifePct >= 80 ? '#d32f2f' : lifePct >= 50 ? '#ed6c02' : '#2e7d32';
    const pmVal = entry.totalLifetimeStrokes - entry.pmCurrentStroke;
    const pmMax = entry.nextStroke - entry.pmCurrentStroke;

    const el = document.createElement('div');
    el.className = 'dash-maint-card';
    el.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
        <span style="font-size:12px; font-weight:700;">${entry.toolNo}</span>
        <span class="dash-chip ${isCritical ? 'dash-chip-danger' : 'dash-chip-warning'}" style="font-size:11px">${isCritical ? 'Critical' : 'Warning'}</span>
      </div>
      <div style="margin-top:10px;"><div style="display:flex; justify-content:space-between; margin-bottom:3px;"><span style="font-size:11px; color:var(--text-muted);">Next PM</span><span style="font-size:11px; font-weight:600;">${formatIndianCompact(pmVal)} / ${formatIndianCompact(pmMax)} (${entry.pmPercentage}%)</span></div><div class="dash-progress" style="height:6px;"><div class="dash-progress-bar" style="width:${Math.min(entry.pmPercentage,100)}%;background:${barColor}"></div></div></div>
      <div style="margin-top:10px;"><div style="display:flex; justify-content:space-between; margin-bottom:3px;"><span style="font-size:11px; color:var(--text-muted);">Tool Life</span><span style="font-size:11px; font-weight:600;">${formatIndianCompact(entry.totalLifetimeStrokes)} / ${formatIndianCompact(entry.toolLife)} (${lifePct}%)</span></div><div class="dash-progress" style="height:6px;"><div class="dash-progress-bar" style="width:${lifePct}%;background:${lifeBar}"></div></div></div>
      ${entry.maintenanceCount > 0 ? `<p style="font-size:11px; color:var(--text-light); margin-top:8px;">Maintained ${entry.maintenanceCount} time${entry.maintenanceCount > 1 ? 's' : ''}</p>` : ''}
    `;
    return el;
  }

  async function load() {
    loading.style.display = 'flex'; columns.style.display = 'none';
    try {
      const [todayData, futureData, pmStatus, pmAll, toolsCount] = await Promise.all([
        apiFetch('/api/tools/today'),
        apiFetch('/api/tools/for-date/' + dateOffset(futureOffset)),
        apiFetch('/api/pm/status?threshold=80&mode=above'),
        apiFetch('/api/pm/status?mode=all'),
        apiFetch('/api/tools/count'),
      ]);

      document.getElementById('toolsDate').textContent = formatDate(todayData.date || new Date().toISOString().slice(0, 10));

      const pmByToolNo = new Map();
      pmAll.forEach(e => pmByToolNo.set(e.toolNo, e));

      // Stats bar
      const totalTools = toolsCount.total || 0;
      const warnTools = pmAll.filter(t => { const p = t.toolLife > 0 ? (t.totalLifetimeStrokes / t.toolLife) * 100 : 0; return p >= 50 && p < 80; }).length;
      const critTools = pmAll.filter(t => { const p = t.toolLife > 0 ? (t.totalLifetimeStrokes / t.toolLife) * 100 : 0; return p >= 80; }).length;

      statsBar.innerHTML = `
        <div class="dash-stat" style="background:#e3f2fd;border-color:#e3f2fd;"><div class="dash-stat-icon" style="background:#1565c0;">🔧</div><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;line-height:1">Distinct Tools</div><div class="dash-stat-value">${totalTools}</div></div></div>
        <div class="dash-stat dash-stat-clickable" onclick="location.href='/dashboards/life-report'" style="background:#e0f2f1;border:1px solid #00897b;"><div class="dash-stat-icon" style="background:#00897b;">✓</div><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">All Life</div><div class="dash-stat-value" style="color:#00897b">${pmAll.length}</div></div></div>
        <div class="dash-stat dash-stat-clickable" onclick="location.href='/dashboards/life-report?filter=warning'" style="background:#fff8e1;border:1px solid #f9a825;"><div class="dash-stat-icon" style="background:#f9a825;">⚠</div><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Life 50–80%</div><div class="dash-stat-value" style="color:#f9a825">${warnTools}</div></div></div>
        <div class="dash-stat dash-stat-clickable" onclick="location.href='/dashboards/life-report?filter=critical'" style="background:#fce4ec;border:1px solid #d32f2f;"><div class="dash-stat-icon" style="background:#d32f2f;">⛔</div><div><div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Life ≥80%</div><div class="dash-stat-value" style="color:#d32f2f">${critTools}</div></div></div>
      `;

      // Stat cards
      statCards.innerHTML = `
        <div class="dash-stat"><div class="dash-stat-icon" style="background:#1565c0;">📅</div><div class="dash-stat-value">${todayData.count ?? '—'}</div><div class="dash-stat-label">Today's Tools</div></div>
        <div class="dash-stat"><div class="dash-stat-icon" style="background:#2e7d32;">📆</div><div class="dash-stat-value">${futureData.count ?? '—'}</div><div class="dash-stat-label">${offsetLabel(futureOffset)}'s Tools</div></div>
        <div class="dash-stat"><div class="dash-stat-icon" style="background:#e65100;">⚠️</div><div class="dash-stat-value">${pmStatus.length}</div><div class="dash-stat-label">Maintenance</div></div>
      `;

      // Today column
      todayBody.innerHTML = '';
      const todayFlat = flattenTools(todayData.tools);
      if (!todayFlat.length) { todayBody.innerHTML = '<div class="dash-empty"><div class="dash-empty-text">No tools scheduled for today.</div></div>'; }
      else { todayFlat.forEach(e => todayBody.appendChild(makeToolCard(e, pmByToolNo))); }

      // Future column
      futureBody.innerHTML = '';
      futureLabel.textContent = offsetLabel(futureOffset);
      const futureFlat = flattenTools(futureData.tools);
      if (!futureFlat.length) { futureBody.innerHTML = '<div class="dash-empty"><div class="dash-empty-text">No tools scheduled.</div></div>'; }
      else { futureFlat.forEach(e => futureBody.appendChild(makeToolCard(e, pmByToolNo))); }

      // Maintenance column
      maintBody.innerHTML = '';
      if (!pmStatus.length) { maintBody.innerHTML = '<div class="dash-empty"><div class="dash-empty-text">No maintenance alerts.</div></div>'; }
      else { pmStatus.forEach(e => maintBody.appendChild(makeMaintCard(e))); }

      columns.style.display = 'flex';
    } catch (err) {
      todayBody.innerHTML = `<div class="dash-alert dash-alert-error">${err.message}</div>`;
      columns.style.display = 'flex';
    }
    loading.style.display = 'none';
  }

  document.getElementById('futureBackBtn').addEventListener('click', () => { if (futureOffset > 1) { futureOffset--; load(); } });
  document.getElementById('futureNextBtn').addEventListener('click', () => { futureOffset++; load(); });
  document.getElementById('todayReverseBtn').addEventListener('click', function() { todayReverse = !todayReverse; this.textContent = todayReverse ? '▼' : '▲'; });

  load();
})();
</script>
{% endblock %}
