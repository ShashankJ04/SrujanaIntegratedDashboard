<!-- Hub RM Correction — parity with dashboards RMCorrectionPage.tsx -->
<div class="ti-hub-section-fill ti-rm-correction" id="rmcRoot">

  <div class="ti-rm-header">
    <div class="ti-rm-header-filters">
      <span style="font-size:24px;line-height:1" aria-hidden="true">✏️</span>
      <h2 style="font-size:18px;font-weight:800;color:var(--ti-text-bright);margin:0">RM Correction</h2>
      <label style="font-size:12px;font-weight:600;color:var(--ti-text-muted)">Start Date</label>
      <input type="date" class="ti-input" id="rmcStartDate" style="width:190px" aria-label="Start date" />
    </div>
    <div class="ti-rm-header-tail">
      <span class="ti-rm-count" id="rmcItemCount">—</span>
      <input type="search" class="ti-input ti-rm-grid-search" id="rmcGridSearch" placeholder="Filter rows…" autocomplete="off" disabled aria-label="Filter table" />
    </div>
  </div>

  <div id="rmcLoading" class="ti-loading" style="display:none"><div class="ti-spinner"></div></div>
  <div id="rmcError" class="ti-alert ti-alert-error" style="display:none;margin:16px 4px"></div>
  <div id="rmcEmpty" class="ti-empty" style="display:none"><div class="ti-empty-icon">📋</div><div class="ti-empty-text">No records found.</div></div>

  <div id="rmcGridHost">
    <div id="rmcGrid" class="ti-hub-section-fill__grid"></div>
  </div>

  <!-- Edit dialog -->
  <div id="rmcEditOverlay" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px">
    <div style="background:#ffffff;border-radius:12px;width:min(480px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.35)">
      <div style="padding:16px 20px;border-bottom:1px solid #e0e0e0;background:#ffffff;border-radius:12px 12px 0 0">
        <h3 style="margin:0;font-size:15px;font-weight:700;color:#1a1a1a">Update RM and Scrap Correction</h3>
      </div>
      <div style="padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;background:#ffffff">
        <div style="display:flex;flex-wrap:wrap;gap:16px;padding:10px 12px;background:#f0f4f8;border-radius:8px;font-size:12px;color:#333">
          <span>Theo RM Remaining: <strong id="rmcEditTheoRm" style="color:#1a1a1a">—</strong></span>
          <span>Scrap: <strong id="rmcEditScrapDisplay" style="color:#1a1a1a">—</strong></span>
        </div>
        <label style="font-size:11px;font-weight:600;color:#333">Actual RM</label>
        <input type="number" class="ti-input" id="rmcEditActualRm" step="0.01" min="0" style="background:#fff;color:#1a1a1a;border:1px solid #ccc" />
        <label style="font-size:11px;font-weight:600;color:#333">RM Remarks</label>
        <input type="text" class="ti-input" id="rmcEditRmRemarks" maxlength="50" style="background:#fff;color:#1a1a1a;border:1px solid #ccc" />
        <label style="font-size:11px;font-weight:600;color:#333">Actual Scrap</label>
        <input type="number" class="ti-input" id="rmcEditActualScrap" step="0.01" style="background:#fff;color:#1a1a1a;border:1px solid #ccc" />
        <label style="font-size:11px;font-weight:600;color:#333">Scrap Remarks</label>
        <input type="text" class="ti-input" id="rmcEditScrapRemarks" maxlength="50" style="background:#fff;color:#1a1a1a;border:1px solid #ccc" />
      </div>
      <div style="padding:12px 20px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;gap:8px;background:#ffffff;border-radius:0 0 12px 12px">
        <button type="button" class="ti-btn ti-btn-outline" id="rmcEditCancel">Cancel</button>
        <button type="button" class="ti-btn ti-btn-primary" id="rmcEditSubmit">Submit</button>
      </div>
    </div>
  </div>

  <!-- History dialog -->
  <div id="rmcHistoryOverlay" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px">
    <div style="background:#ffffff;border-radius:12px;width:min(720px,96vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.35)">
      <div style="padding:16px 20px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;background:#ffffff;border-radius:12px 12px 0 0">
        <h3 style="margin:0;font-size:15px;font-weight:700;color:#1a1a1a">Correction History</h3>
        <button type="button" id="rmcHistoryClose" style="background:none;border:none;font-size:20px;cursor:pointer;color:#666;padding:0 4px" aria-label="Close">✕</button>
      </div>
      <div id="rmcHistoryMeta" style="padding:8px 20px;background:#f0f4f8;font-size:12px;color:#555;display:flex;gap:20px;flex-wrap:wrap"></div>
      <div id="rmcHistoryBody" style="padding:16px 20px;overflow:auto;flex:1;background:#ffffff"></div>
      <div style="padding:12px 20px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;background:#ffffff;border-radius:0 0 12px 12px">
        <button type="button" class="ti-btn ti-btn-outline" id="rmcHistoryClose2">Close</button>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  const SG_LAYOUT_KEY = 'hub-rm-correction';
  const plusAccess = new Set((window.CURRENT_PERMISSIONS && window.CURRENT_PERMISSIONS.plusAccess) || []);
  const canEdit = plusAccess.has('rm_correction_plus');

  let _entries = [];
  let _expanded = {};
  let _batchCache = {};
  let _editEntry = null;
  let _submitting = false;
  let _grid = null;

  const dateInput = document.getElementById('rmcStartDate');
  const gridHost = document.getElementById('rmcGridHost');
  const gridEl = document.getElementById('rmcGrid');
  const gridSearch = document.getElementById('rmcGridSearch');
  const itemCount = document.getElementById('rmcItemCount');

  const d = new Date();
  d.setDate(d.getDate() - 10);
  dateInput.value = d.toISOString().slice(0, 10);
  dateInput.max = new Date().toISOString().slice(0, 10);

  function rowKey(e) { return (e.rawMaterial || '') + '__' + (e.batch || ''); }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  function findEntry(key) {
    return _entries.find(function(e) { return rowKey(e) === key; });
  }

  function buildGridRows() {
    return _entries.map(function(entry) {
      return {
        rawMaterial: entry.rawMaterial,
        batch: entry.batch,
        totalInwarded: entry.totalInwarded,
        rmGiven: entry.rmGiven,
        rmRemaining: entry.rmRemaining,
        scrap: entry.scrap,
        rmid: entry.rmid,
        _rowKey: rowKey(entry),
        _entry: entry,
      };
    });
  }

  function formatActions(_, row) {
    const key = row._rowKey;
    const editTitle = canEdit ? 'Edit' : 'You do not have permission to edit corrections';
    const expCls = _expanded[key] ? ' is-expanded' : '';
    return (
      '<button type="button" class="ti-btn ti-btn-outline ti-btn-xs rmc-act-edit" data-row-key="' + escapeAttr(key) + '" ' +
        (canEdit ? '' : 'disabled ') +
        'style="font-size:11px;margin:0 2px" title="' + escapeHtml(editTitle) + '">✎</button>' +
      '<button type="button" class="ti-btn ti-btn-outline ti-btn-xs rmc-act-detail' + expCls + '" data-row-key="' + escapeAttr(key) + '" ' +
        'style="font-size:11px;margin:0 2px" title="Production Details">▤</button>' +
      '<button type="button" class="ti-btn ti-btn-outline ti-btn-xs rmc-act-history" data-row-key="' + escapeAttr(key) + '" ' +
        'style="font-size:11px;margin:0 2px" title="Correction History">📜</button>'
    );
  }

  const columns = [
    { key: 'rawMaterial', label: 'Raw Material', className: 'val-bold', width: 160 },
    { key: 'batch', label: 'Batch', width: 110 },
    { key: 'totalInwarded', label: 'Total Inwarded', align: 'right', format: function(v) { return Number(v).toFixed(2); } },
    { key: 'rmGiven', label: 'RM Given', align: 'right', format: function(v) { return Number(v).toFixed(2); } },
    { key: 'rmRemaining', label: 'Theo RM Remaining', align: 'right', format: function(v) { return Number(v).toFixed(2); } },
    { key: 'scrap', label: 'Scrap', align: 'right', format: function(v) { return Number(v).toFixed(2); } },
    { key: 'actions', label: 'Actions', align: 'center', sortable: false, width: 130, format: formatActions },
  ];

  function destroyGrid() {
    if (_grid && _grid.destroy) {
      _grid.destroy();
      _grid = null;
    }
    gridEl.innerHTML = '';
  }

  function refreshGridRows(preserveSearch) {
    if (!_grid) return;
    const savedSearch = preserveSearch ? gridSearch.value : '';
    _grid.setRows(buildGridRows());
    if (preserveSearch && savedSearch) {
      gridSearch.value = savedSearch;
      gridSearch.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  function redrawGridBody() {
    if (_grid && _grid.redrawBody) _grid.redrawBody();
  }

  function sgGridOptions() {
    return {
      layoutKey: SG_LAYOUT_KEY,
      countElement: itemCount,
      searchInputElement: gridSearch,
      search: true,
      resizable: true,
      pinnable: true,
      reorderable: true,
      emptyText: 'No records found.',
      countLabel: 'rows',
      detailRowExpanded: function(row) { return !!_expanded[row._rowKey]; },
      detailRowHtml: function(row) { return detailRowContent(row); },
      onBodyRendered: function() { mountInlineDetails(); },
    };
  }

  function batchDetailHtml(rows) {
    if (!rows.length) {
      return '<span style="color:var(--ti-text-dim);font-size:12px">No production rows found for this batch in selected date range.</span>';
    }
    const totals = { noOfComp:0, theoRmKg:0, calCompWt:0, theoScrap:0, sfRejNos:0, suWastageNos:0, scrapKg:0, partWtKg:0 };
    rows.forEach(function(r) {
      totals.noOfComp += Number(r.noOfComp) || 0;
      totals.theoRmKg += Number(r.theoRmKg) || 0;
      totals.calCompWt += Number(r.calCompWt) || 0;
      totals.theoScrap += (Number(r.theoRmKg) - Number(r.calCompWt)) || 0;
      totals.sfRejNos += Number(r.sfRejNos) || 0;
      totals.suWastageNos += Number(r.suWastageNos) || 0;
      totals.scrapKg += Number(r.scrapKg) || 0;
      totals.partWtKg += Number(r.partWtKg) || 0;
    });

    let html = '<div style="display:inline-block;margin-bottom:8px;padding:4px 10px;border-radius:6px;background:#1565c0;color:#fff;font-size:11px;font-weight:700">Production Details</div>';
    html += '<table class="ti-table" style="width:100%;font-size:11px;table-layout:fixed;border:1px solid #1565c0;border-radius:6px"><thead><tr>';
    html += '<th>Production Date</th><th>Part No</th><th>Lot No</th><th>Tool</th>';
    html += '<th class="text-right">No Of Comp</th><th class="text-right">Theo RM(Kg)</th><th class="text-right">Cal Comp Wt (Kg)</th>';
    html += '<th class="text-right">Theo Scrap</th><th class="text-right">SF Rej(Nos)</th><th class="text-right">SU Wastage(Nos)</th>';
    html += '<th class="text-right">Scrap(Kg)</th><th class="text-right">Part Wt(Kg)</th></tr></thead><tbody>';

    rows.forEach(function(r) {
      const theo = Number(r.theoRmKg) || 0;
      const cal = Number(r.calCompWt) || 0;
      html += '<tr><td>' + escapeHtml(r.productionDate) + '</td><td>' + escapeHtml(r.partNo || '—') + '</td><td>' + escapeHtml(r.lotNo || '—') + '</td><td>' + escapeHtml(r.tool || '—') + '</td>';
      html += '<td class="text-right">' + r.noOfComp + '</td>';
      html += '<td class="text-right">' + theo.toFixed(4) + '</td>';
      html += '<td class="text-right">' + cal.toFixed(4) + '</td>';
      html += '<td class="text-right">' + (theo - cal).toFixed(4) + '</td>';
      html += '<td class="text-right">' + r.sfRejNos + '</td><td class="text-right">' + r.suWastageNos + '</td>';
      html += '<td class="text-right">' + (Number(r.scrapKg)||0).toFixed(2) + '</td><td class="text-right">' + (Number(r.partWtKg)||0).toFixed(2) + '</td></tr>';
    });

    html += '<tr style="font-weight:700;background:var(--ti-surface-3)">';
    html += '<td colspan="4">Total</td>';
    html += '<td class="text-right">' + totals.noOfComp + '</td>';
    html += '<td class="text-right">' + totals.theoRmKg.toFixed(4) + '</td>';
    html += '<td class="text-right">' + totals.calCompWt.toFixed(4) + '</td>';
    html += '<td class="text-right">' + totals.theoScrap.toFixed(4) + '</td>';
    html += '<td class="text-right">' + totals.sfRejNos + '</td><td class="text-right">' + totals.suWastageNos + '</td>';
    html += '<td class="text-right">' + totals.scrapKg.toFixed(2) + '</td><td class="text-right">' + totals.partWtKg.toFixed(2) + '</td>';
    html += '</tr></tbody></table>';
    return html;
  }

  function detailRowContent(row) {
    const batch = row.batch;
    if (_batchCache[batch] && _batchCache[batch].entries) {
      return '<div class="rmc-detail-inline"><div class="rmc-detail-body" data-batch="' + escapeAttr(batch) + '">' + batchDetailHtml(_batchCache[batch].entries) + '</div></div>';
    }
    return '<div class="rmc-detail-inline"><div class="rmc-detail-body" data-batch="' + escapeAttr(batch) + '" data-needs-load="1"><span style="color:var(--ti-text-muted);font-size:12px">Loading batch production details…</span></div></div>';
  }

  function mountInlineDetails() {
    gridEl.querySelectorAll('.rmc-detail-body[data-needs-load="1"]').forEach(function(el) {
      el.removeAttribute('data-needs-load');
      const batch = el.getAttribute('data-batch');
      if (batch) loadBatchDetail(batch, el);
    });
  }

  async function loadEntries() {
    const loading = document.getElementById('rmcLoading');
    const errorEl = document.getElementById('rmcError');
    const emptyEl = document.getElementById('rmcEmpty');

    loading.style.display = 'flex';
    errorEl.style.display = 'none';
    gridHost.classList.remove('is-visible');
    emptyEl.style.display = 'none';
    gridSearch.disabled = true;
    gridSearch.value = '';
    itemCount.textContent = '—';
    destroyGrid();

    try {
      const startDate = dateInput.value;
      const data = await apiFetch('/api/rm-correction/?startDate=' + encodeURIComponent(startDate));
      _entries = data.entries || [];
      _expanded = {};
      _batchCache = {};
      renderMain();
    } catch (err) {
      errorEl.textContent = err.message || 'Failed to load RM correction data';
      errorEl.style.display = 'block';
    } finally {
      loading.style.display = 'none';
    }
  }

  function renderMain() {
    const emptyEl = document.getElementById('rmcEmpty');

    if (!_entries.length) {
      gridHost.classList.remove('is-visible');
      emptyEl.style.display = 'block';
      destroyGrid();
      return;
    }

    emptyEl.style.display = 'none';
    gridHost.classList.add('is-visible');
    gridSearch.disabled = false;

    if (typeof SuperGrid === 'undefined' || typeof SuperGrid.create !== 'function') {
      document.getElementById('rmcError').textContent = 'SuperGrid is not loaded.';
      document.getElementById('rmcError').style.display = 'block';
      return;
    }

    destroyGrid();
    _grid = SuperGrid.create(gridEl, {
      columns: columns,
      rows: buildGridRows(),
      omitToolbar: true,
      options: sgGridOptions(),
    });
  }

  function isBatchExpanded(batch) {
    return _entries.some(function(e) {
      return _expanded[rowKey(e)] && e.batch === batch;
    });
  }

  async function loadBatchDetail(batch, container) {
    if (_batchCache[batch] && _batchCache[batch].entries) {
      container.innerHTML = batchDetailHtml(_batchCache[batch].entries);
      return;
    }
    container.innerHTML = '<span style="color:var(--ti-text-muted);font-size:12px">Loading batch production details…</span>';
    try {
      const data = await apiFetch('/api/rm-correction/batch/' + encodeURIComponent(batch));
      _batchCache[batch] = { entries: data.entries || [] };
      if (container.isConnected) {
        container.innerHTML = batchDetailHtml(_batchCache[batch].entries);
      }
      if (isBatchExpanded(batch)) redrawGridBody();
    } catch (err) {
      container.innerHTML = '<div class="ti-alert ti-alert-error" style="margin:4px 0;font-size:12px">' + escapeHtml(err.message || 'Failed to load batch details') + '</' + d + '>';
    }
  }

  function openEdit(entry) {
    _editEntry = entry;
    document.getElementById('rmcEditTheoRm').textContent = Number(entry.rmRemaining).toFixed(2);
    document.getElementById('rmcEditScrapDisplay').textContent = Number(entry.scrap).toFixed(2);
    document.getElementById('rmcEditActualRm').value = '';
    document.getElementById('rmcEditRmRemarks').value = '';
    document.getElementById('rmcEditActualScrap').value = '';
    document.getElementById('rmcEditScrapRemarks').value = '';
    document.getElementById('rmcEditActualRm').disabled = (Number(entry.rmRemaining) === 0);
    document.getElementById('rmcEditRmRemarks').disabled = (Number(entry.rmRemaining) === 0);
    document.getElementById('rmcEditOverlay').style.display = 'flex';
  }

  function closeEdit() {
    _editEntry = null;
    document.getElementById('rmcEditOverlay').style.display = 'none';
  }

  async function submitEdit() {
    if (!_editEntry || _submitting) return;
    const entry = _editEntry;
    const rmStr = document.getElementById('rmcEditActualRm').value.trim();
    const rmRem = document.getElementById('rmcEditRmRemarks').value.trim();
    const scStr = document.getElementById('rmcEditActualScrap').value.trim();
    const scRem = document.getElementById('rmcEditScrapRemarks').value.trim();
    const rmEntered = rmStr !== '';
    const scrapEntered = scStr !== '';

    if (!rmEntered && !scrapEntered) {
      showSnackbar('Enter at least one Actual RM or Actual Scrap with remarks to submit.');
      return;
    }

    const item = { batch: entry.batch, rmid: entry.rmid };

    if (rmEntered) {
      if (Number(entry.rmRemaining) === 0) {
        showSnackbar('Actual RM cannot be entered when Theo RM Remaining is 0.');
        return;
      }
      const rmVal = Number(rmStr);
      if (isNaN(rmVal) || rmVal < 0) {
        showSnackbar('Actual RM must be a valid non-negative number.');
        return;
      }
      if (!rmRem) {
        showSnackbar('RM Remarks is required when Actual RM is entered.');
        return;
      }
      item.theoRmRemaining = Number(entry.rmRemaining);
      item.actualRm = rmVal;
      item.rmRemarks = rmRem;
    }

    if (scrapEntered) {
      const scVal = Number(scStr);
      if (isNaN(scVal)) {
        showSnackbar('Actual Scrap must be a valid number.');
        return;
      }
      if (!scRem) {
        showSnackbar('Scrap Remarks is required when Actual Scrap is entered.');
        return;
      }
      item.scrapBefore = Number(entry.scrap);
      item.actualScrap = scVal;
      item.scrapRemarks = scRem;
    }

    _submitting = true;
    const btn = document.getElementById('rmcEditSubmit');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const result = await apiFetch('/api/rm-correction/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: [item] })
      });
      if (rmEntered) entry.rmRemaining = Number(document.getElementById('rmcEditActualRm').value);
      if (scrapEntered) entry.scrap = Number(document.getElementById('rmcEditActualScrap').value);
      showSnackbar('Submitted successfully (' + result.inserted + ' row(s): RM ' + result.insertedRm + ', Scrap ' + result.insertedScrap + ')');
      closeEdit();
      refreshGridRows(true);
    } catch (err) {
      showSnackbar(err.message || 'Failed to submit RM corrections');
    } finally {
      _submitting = false;
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  }

  async function openHistory(batch, rmid, rawMaterial) {
    const overlay = document.getElementById('rmcHistoryOverlay');
    const meta = document.getElementById('rmcHistoryMeta');
    const body = document.getElementById('rmcHistoryBody');
    meta.innerHTML = '<span>Raw Material: <strong>' + escapeHtml(rawMaterial || '—') + '</strong></span><span>Batch: <strong>' + escapeHtml(batch || '—') + '</strong></span>';
    body.innerHTML = '<div style="text-align:center;padding:24px"><div class="ti-spinner"></div></div>';
    overlay.style.display = 'flex';

    try {
      const data = await apiFetch('/api/rm-correction/history/' + encodeURIComponent(rmid) + '/' + encodeURIComponent(batch));
      const entries = data.entries || [];
      if (!entries.length) {
        body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--ti-text-dim);font-size:13px">No RM/Scrap correction history found for this Batch and RM.</div>';
        return;
      }
      let html = '<table class="ti-table" style="width:100%;font-size:12px"><thead><tr>';
      html += '<th>Type</th><th class="text-right">Qty Before</th><th class="text-right">Actual Qty</th>';
      html += '<th>Remarks</th><th>Entry Time</th><th>User</th></tr></thead><tbody>';
      entries.forEach(function(item) {
        const badge = item.type === 'RM' ? 'background:var(--ti-blue);color:#fff' : 'background:#e65100;color:#fff';
        const actualQty = (Number(item.qtyBefore) - Number(item.correction)).toFixed(2);
        html += '<tr><td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;' + badge + '">' + escapeHtml(item.type) + '</span></td>';
        html += '<td class="text-right">' + Number(item.qtyBefore).toFixed(2) + '</td>';
        html += '<td class="text-right">' + actualQty + '</td>';
        html += '<td>' + escapeHtml(item.remarks || '—') + '</td>';
        html += '<td>' + escapeHtml(item.createdAt) + '</td>';
        html += '<td>' + escapeHtml(item.userLogin || '—') + '</td></tr>';
      });
      html += '</tbody></table>';
      body.innerHTML = html;
    } catch (err) {
      body.innerHTML = '<div class="ti-alert ti-alert-error">' + escapeHtml(err.message || 'Failed to load correction history') + '</div>';
    }
  }

  function closeHistory() {
    document.getElementById('rmcHistoryOverlay').style.display = 'none';
  }

  document.getElementById('rmcRoot').addEventListener('click', function(e) {
    const editBtn = e.target.closest('.rmc-act-edit');
    if (editBtn && !editBtn.disabled) {
      const key = editBtn.getAttribute('data-row-key');
      const entry = key ? findEntry(key) : null;
      if (entry) openEdit(entry);
      return;
    }

    const detBtn = e.target.closest('.rmc-act-detail');
    if (detBtn) {
      const key = detBtn.getAttribute('data-row-key');
      if (!key) return;
      _expanded[key] = !_expanded[key];
      redrawGridBody();
      return;
    }

    const histBtn = e.target.closest('.rmc-act-history');
    if (histBtn) {
      const key = histBtn.getAttribute('data-row-key');
      const entry = key ? findEntry(key) : null;
      if (entry) openHistory(entry.batch, entry.rmid, entry.rawMaterial);
    }
  });

  dateInput.addEventListener('change', loadEntries);

  document.getElementById('rmcEditCancel').addEventListener('click', closeEdit);
  document.getElementById('rmcEditSubmit').addEventListener('click', submitEdit);
  document.getElementById('rmcEditOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeEdit();
  });

  document.getElementById('rmcHistoryClose').addEventListener('click', closeHistory);
  document.getElementById('rmcHistoryClose2').addEventListener('click', closeHistory);
  document.getElementById('rmcHistoryOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeHistory();
  });

  loadEntries();
})();
</script>
