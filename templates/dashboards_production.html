{% extends "base_dashboards.html" %}
{% block title %}Production Dashboard{% endblock %}

{% block content %}
<div style="min-height:100vh; display:flex; flex-direction:column;">
  <div style="padding:16px 24px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <span style="font-size:24px;">🏭</span>
    <h1 class="dash-page-title" style="flex-grow:1;">Production Dashboard</h1>
    <input type="date" class="dash-input" id="prodDate" style="width:180px;">
    <button class="dash-btn dash-btn-primary" id="prodSearchBtn">🔍 Search</button>
  </div>

  <div style="flex:1; padding:20px;">
    <div id="prodLoading" class="dash-loading-center" style="display:none;"><div class="dash-spinner"></div></div>
    <div id="prodError" style="display:none;"></div>
    <div id="prodContent" style="display:none;"></div>
    <div id="prodEmpty" class="dash-empty"><div class="dash-empty-icon">🏭</div><div class="dash-empty-text">Select a date and click Search to view production data</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const dateInput = document.getElementById('prodDate');
  dateInput.value = yesterday.toISOString().slice(0, 10);

  function toApiDate(iso) { const [y, m, d] = iso.split('-'); return d + m + y; }

  const columns = [
    { key:'customer', label:'Customer' }, { key:'partno', label:'Part No' }, { key:'partname', label:'Part Name' }, { key:'rawMaterial', label:'RM' },
    { key:'scheduledDate', label:'Pln Dt', fmt: v => v ? new Date(v).toLocaleDateString('en-IN', { day:'2-digit', month:'2-digit', year:'numeric' }) : '—' },
    { key:'scheduledQty', label:'Pln Qty', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'prodQty', label:'Prod Qty', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'variance', label:'Var', align:'center', fmt: v => { const el = createVarianceChip(v); return el.outerHTML; } },
    { key:'setupWastage', label:'SW', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'sfRejection', label:'SF', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'netQty', label:'Grs Qty', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'issuedQty', label:'RM Isu', align:'right', fmt: v => Number(v).toFixed(2) },
    { key:'requiredQty', label:'RM Rqd', align:'right', fmt: v => Number(v).toFixed(2) },
    { key:'fgStock', label:'FG', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'wipStock', label:'WIP', align:'right', fmt: v => formatIndianNumber(v) },
    { key:'totalStock', label:'Total Stk', align:'right', fmt: v => formatIndianNumber(v) },
  ];

  async function search() {
    const iso = dateInput.value;
    if (!iso) return;

    document.getElementById('prodLoading').style.display = 'flex';
    document.getElementById('prodContent').style.display = 'none';
    document.getElementById('prodEmpty').style.display = 'none';
    document.getElementById('prodError').style.display = 'none';

    try {
      const data = await apiFetch('/api/production/' + toApiDate(iso));
      const entries = (data.entries || []).sort((a, b) => a.customer.localeCompare(b.customer) || a.partno.localeCompare(b.partno));
      const totals = data.totals;
      const stockTotals = entries.reduce((a, e) => ({ fg: a.fg + e.fgStock, wip: a.wip + e.wipStock, total: a.total + e.totalStock }), { fg:0, wip:0, total:0 });

      let html = '<div class="dash-table-wrap"><table class="dash-table"><thead><tr><th>#</th>';
      columns.forEach(c => html += `<th class="${c.align === 'right' ? 'text-right' : c.align === 'center' ? 'text-center' : ''}">${c.label}</th>`);
      html += '</tr></thead><tbody>';

      entries.forEach((e, i) => {
        html += `<tr><td style="color:var(--text-muted)">${i+1}</td>`;
        columns.forEach(c => {
          const val = c.fmt ? c.fmt(e[c.key], e) : (e[c.key] ?? '—');
          html += `<td class="${c.align === 'right' ? 'text-right' : c.align === 'center' ? 'text-center' : ''}">${val}</td>`;
        });
        html += '</tr>';
      });

      // Totals row
      html += '<tr class="totals-row"><td></td><td colspan="5"><strong>TOTAL</strong></td>';
      html += `<td class="text-right">${formatIndianNumber(totals.scheduledQty)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(totals.prodQty)}</td>`;
      html += `<td class="text-center">${createVarianceChip(totals.variance).outerHTML}</td>`;
      html += `<td class="text-right">${formatIndianNumber(totals.setupWastage)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(totals.sfRejection)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(totals.netQty)}</td>`;
      html += `<td class="text-right">${totals.issuedQty.toFixed(2)}</td>`;
      html += `<td class="text-right">${totals.requiredQty.toFixed(2)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(stockTotals.fg)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(stockTotals.wip)}</td>`;
      html += `<td class="text-right">${formatIndianNumber(stockTotals.total)}</td>`;
      html += '</tr></tbody></table></div>';

      document.getElementById('prodContent').innerHTML = html;
      document.getElementById('prodContent').style.display = 'block';
    } catch(err) {
      document.getElementById('prodError').innerHTML = `<div class="dash-alert dash-alert-error">${err.message}</div>`;
      document.getElementById('prodError').style.display = 'block';
    }
    document.getElementById('prodLoading').style.display = 'none';
  }

  document.getElementById('prodSearchBtn').addEventListener('click', search);
  dateInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

  // Auto-load yesterday's data
  search();
})();
</script>
{% endblock %}
