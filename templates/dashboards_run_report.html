{% extends "base_dashboards.html" %}
{% block title %}Run Report{% endblock %}

{% block content %}
<div style="min-height:100vh; display:flex; flex-direction:column; padding:20px;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
    <a href="/dashboards/reports" class="dash-btn dash-btn-outline dash-btn-sm">← Back</a>
    <h1 class="dash-page-title" id="runTitle">Loading…</h1>
  </div>

  <div id="runLoading" class="dash-loading-center" style="display:none;"><div class="dash-spinner"></div></div>

  <!-- Inputs area -->
  <div class="dash-card" style="padding:16px;" id="runInputCard">
    <div style="display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;" id="runInputs"></div>
  </div>

  <div style="margin-top:16px; flex:1; display:flex; flex-direction:column;" id="runResultsArea" style="display:none;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <span style="font-size:13px; color:var(--text-muted);" id="runMeta"></span>
      <button class="dash-btn dash-btn-outline dash-btn-sm" id="runExportBtn" style="display:none;">⬇ Export Excel</button>
    </div>
    <div class="dash-table-wrap" style="flex:1; min-height:0;" id="runTableWrap" style="display:none;"></div>
  </div>

  <div id="runEmpty" class="dash-empty" style="display:none;"><div class="dash-empty-icon">📄</div><div class="dash-empty-text">No results. Run the report to see data.</div></div>
  <div id="runError" style="display:none;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const reportId = params.get('reportId');
  if (!reportId) { window.location.href = '/dashboards/reports'; return; }

  let report = null, lastResult = null;

  async function loadReport() {
    try {
      report = await apiFetch('/api/reports/reports/' + reportId);
      document.getElementById('runTitle').textContent = report.name;
      renderInputs();
    } catch(err) { showSnackbar(err.message); }
  }

  function reportVarControlHtml(v) {
    const id = 'run-var-' + v;
    const label = '{' + v + '}';
    const u = v.toUpperCase();
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (u === 'MONTH' || u.endsWith('_MONTH')) {
      const cur = new Date().getMonth() + 1;
      let opts = '';
      for (let m = 1; m <= 12; m++) {
        opts += '<option value="' + m + '"' + (m === cur ? ' selected' : '') + '>' + m + ' — ' + monthNames[m - 1] + '</option>';
      }
      return '<div><label class="dash-form-label">' + label + '</label><select class="dash-input" id="' + id + '" style="min-width:200px">' + opts + '</select></div>';
    }
    if (u === 'YEAR' || u === 'Y' || u.endsWith('_YEAR')) {
      const y0 = new Date().getFullYear();
      let opts = '';
      for (let y = y0 - 5; y <= y0 + 1; y++) {
        opts += '<option value="' + y + '"' + (y === y0 ? ' selected' : '') + '>' + y + '</option>';
      }
      return '<div><label class="dash-form-label">' + label + '</label><select class="dash-input" id="' + id + '" style="width:120px">' + opts + '</select></div>';
    }
    if (u === 'DAY' || u === 'DOM' || u === 'D') {
      return '<div><label class="dash-form-label">' + label + '</label><input type="number" class="dash-input" id="' + id + '" min="1" max="31" placeholder="1–31" style="width:100px"></div>';
    }
    if ((u.includes('DATE') || u.endsWith('_DT') || u === 'AS_ON') && !u.endsWith('_MONTH') && !u.endsWith('_YEAR')) {
      const today = new Date().toISOString().slice(0, 10);
      return '<div><label class="dash-form-label">' + label + '</label><input type="date" class="dash-input" id="' + id + '" value="' + today + '" style="width:180px"></div>';
    }
    return '<div><label class="dash-form-label">' + label + '</label><input type="text" class="dash-input" id="' + id + '" placeholder="' + v + '" style="width:180px"></div>';
  }

  function collectRunVariables() {
    const variables = {};
    (report.variables || []).forEach(v => {
      const el = document.getElementById('run-var-' + v);
      if (el) variables[v] = el.value;
    });
    return variables;
  }

  function renderInputs() {
    const vars = report.variables || [];
    const el = document.getElementById('runInputs');
    el.innerHTML = '';

    vars.forEach(v => {
      const div = document.createElement('div');
      div.innerHTML = reportVarControlHtml(v);
      el.appendChild(div);
    });

    const runBtn = document.createElement('button');
    runBtn.className = 'dash-btn dash-btn-primary';
    runBtn.textContent = '▶ Run';
    runBtn.addEventListener('click', runReport);
    el.appendChild(runBtn);
  }

  async function runReport() {
    const variables = collectRunVariables();

    document.getElementById('runLoading').style.display = 'flex';
    document.getElementById('runTableWrap').style.display = 'none';
    document.getElementById('runEmpty').style.display = 'none';
    document.getElementById('runError').style.display = 'none';
    document.getElementById('runResultsArea').style.display = 'none';

    try {
      const result = await apiPost('/api/reports/reports/' + reportId + '/run', { variables });
      lastResult = result;

      if (!result.rows || !result.rows.length) {
        document.getElementById('runEmpty').style.display = 'block';
        document.getElementById('runLoading').style.display = 'none';
        return;
      }

      document.getElementById('runMeta').textContent = `${result.rowCount} rows • ${new Date(result.executedAt).toLocaleString()}`;
      document.getElementById('runExportBtn').style.display = '';
      document.getElementById('runResultsArea').style.display = 'flex';

      let html = '<table class="dash-table"><thead><tr>';
      result.columns.forEach(c => html += `<th>${c}</th>`);
      html += '</tr></thead><tbody>';
      result.rows.forEach(r => {
        html += '<tr>';
        result.columns.forEach(c => {
          const v = r[c];
          html += `<td>${v != null ? v : '—'}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';

      document.getElementById('runTableWrap').innerHTML = html;
      document.getElementById('runTableWrap').style.display = 'block';
    } catch(err) {
      document.getElementById('runError').innerHTML = `<div class="dash-alert dash-alert-error">${err.message}</div>`;
      document.getElementById('runError').style.display = 'block';
    }
    document.getElementById('runLoading').style.display = 'none';
  }

  // Export
  document.getElementById('runExportBtn').addEventListener('click', async () => {
    if (!lastResult) return;
    const variables = collectRunVariables();
    await apiDownload('/api/reports/reports/' + reportId + '/export', { variables, fileName: report.name + '.xlsx' }, report.name + '.xlsx');
  });

  loadReport();
})();
</script>
{% endblock %}
