<!-- Hub Reports (REPT) — Ultra-compact toolbar, maximized grid -->

<section class="ti-section ti-hub-section-fill reports-runner" data-section="reports" id="section-reports">

  <!-- ═══ COMPACT TOOLBAR — single strip ═══ -->
  <div class="rr-toolbar">
    <h2 class="rr-toolbar__title" id="runReportTitle">Reports</h2>
    <span id="runReportSub" class="rr-toolbar__hint">Select a report from the sidebar</span>

    <!-- Inline variables (hidden until a report with vars is selected) -->
    <div id="runVarsPanel" class="rr-toolbar__vars" style="display:none"></div>

    <!-- Spacer pushes actions right -->
    <div class="rr-toolbar__spacer"></div>

    <!-- Actions cluster -->
    <button type="button" class="rr-btn rr-btn--clear" id="runBackBtn" style="display:none" title="Back to previous report">← Back</button>
    <button type="button" class="rr-btn rr-btn--run" id="runExecuteBtn" disabled title="Run report">▶ Run</button>
    <span id="reportsGridCount" class="rr-pill sg-count" style="display:none" aria-live="polite"></span>
    <input type="search" id="reportsGridSearch" class="rr-search sg-search" placeholder="Search columns…" style="display:none" autocomplete="off" />
    <button type="button" class="rr-btn rr-btn--clear" id="runClearBtn" style="display:none" title="Clear parameters">✕</button>
    <button type="button" class="rr-btn rr-btn--export" id="runExportBtn" disabled title="Export to Excel">⬇ Export</button>
  </div>

  <!-- ═══ LOADING ═══ -->
  <div id="runLoading" class="rr-loading" style="display:none"><div class="rr-loading__bar"></div></div>

  <!-- ═══ ERROR ═══ -->
  <div id="runError" class="rr-error" style="display:none"></div>

  <!-- ═══ GRID — fills all remaining space ═══ -->
  <div class="rr-grid-host">
    <div id="runTable" style="display:none"></div>
    <div id="runEmpty" class="rr-empty" style="display:none">
      <span class="rr-empty__icon">📋</span>
      <span class="rr-empty__text">Select a report from the <strong>sidebar</strong> to get started</span>
    </div>
  </div>

  <!-- Component Stock widget (handler report only; hidden by default) -->
  <div id="runComponentStockHost" class="rr-component-stock-host" style="display:none">
    {% include 'hub_component_stock.html' %}
  </div>

  <!-- Hidden picker kept for sidebar-collapsed fallback -->
  <select id="reportsRunnerPicker" class="rr-hidden-picker" style="display:none" aria-hidden="true">
    <option value="">Choose a report…</option>
  </select>
</section>

<script>
(function() {
  let currentRunReport = null, lastRunResult = null;
  let currentRunVariables = {};
  let currentViewMode = 'root';
  let runGrid = null;
  const runViewStack = [];
  let pickerIgnoreChange = false;
  let _prevSidebarState = null; // remember sidebar state before auto-collapse
  let _activeNoFormatColumns = new Set(); // columns that should not receive number grouping

  function reportsRowFilter() {
    const v = new URLSearchParams(window.location.search).get('rowFilter');
    return v ? String(v).trim().toLowerCase() : '';
  }

  function rowValueCaseInsensitive(row, candidates) {
    if (!row) return undefined;
    const keys = Object.keys(row);
    for (let i = 0; i < candidates.length; i++) {
      const target = String(candidates[i]).trim().toLowerCase();
      for (let j = 0; j < keys.length; j++) {
        if (String(keys[j]).trim().toLowerCase() === target) return row[keys[j]];
      }
    }
    return undefined;
  }

  function applyReportsRowFilter(rows) {
    const key = reportsRowFilter();
    if (!key || !Array.isArray(rows)) return rows;
    if (key === 'balance') {
      return rows.filter(function(r) {
        const scheduled = Number(rowValueCaseInsensitive(r, ['Schedule Qty', 'schedule qty']) || 0);
        const dispatched = Number(rowValueCaseInsensitive(r, ['Dispatched Qty', 'dispatch qty', 'dispatched qty']) || 0);
        return scheduled !== dispatched;
      });
    }
    return rows;
  }

  function updateReportsRowFilterHint() {
    const sub = document.getElementById('runReportSub');
    if (!sub) return;
    const key = reportsRowFilter();
    if (key === 'balance') {
      sub.textContent = 'Showing balance lines only (dispatched qty ≠ schedule qty)';
      sub.style.display = '';
      return;
    }
    if (currentRunReport) sub.style.display = 'none';
  }

  /* ── Auto-collapse sidebar for max grid width ── */
  function autoCollapseSidebar() {
    const sidebar = document.querySelector('.ti-sidebar');
    if (!sidebar) return;
    _prevSidebarState = sidebar.classList.contains('collapsed');
    if (!_prevSidebarState) {
      sidebar.classList.add('collapsed');
      localStorage.setItem('hub_sidebar', 'collapsed');
    }
  }

  function restoreSidebar() {
    if (_prevSidebarState === false) {
      const sidebar = document.querySelector('.ti-sidebar');
      if (sidebar) {
        sidebar.classList.remove('collapsed');
        localStorage.setItem('hub_sidebar', 'expanded');
      }
    }
    _prevSidebarState = null;
  }

  // Auto-collapse on section load (but not aggressively — user can re-expand)
  // We skip auto-collapse so the user can use the sidebar tree to navigate reports.
  // Instead, expand the reports tree automatically.
  (function() {
    const tree = document.getElementById('ti-nav-reports-tree');
    const chev = document.getElementById('ti-nav-reports-chevron');
    if (tree) {
      tree.hidden = false;
      if (chev) {
        chev.setAttribute('aria-expanded', 'true');
        chev.textContent = '▾';
      }
    }
  })();

  /* ── Picker (hidden, for programmatic sync) ── */
  function syncReportsPicker(reportId) {
    const sel = document.getElementById('reportsRunnerPicker');
    if (!sel) return;
    pickerIgnoreChange = true;
    sel.value = reportId ? String(reportId) : '';
    pickerIgnoreChange = false;
  }

  async function populateReportsPicker() {
    const sel = document.getElementById('reportsRunnerPicker');
    if (!sel) return;
    const keep = sel.value;
    sel.innerHTML = '<option value="">Choose a report…</option>';
    try {
      const groups = await apiFetch('/api/reports/groups');
      for (const g of groups) {
        const reports = await apiFetch('/api/reports/reports?groupId=' + encodeURIComponent(g.id) + '&pinnedOnly=1');
        if (!reports.length) continue;
        const og = document.createElement('optgroup');
        og.label = g.name;
        reports.forEach(r => {
          const o = document.createElement('option');
          o.value = r.id;
          o.textContent = r.name;
          og.appendChild(o);
        });
        sel.appendChild(og);
      }
    } catch (e) {
      console.error('Reports picker:', e);
    }
    if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
    else syncReportsPicker(currentRunReport && currentRunReport.id);
  }

  window.__hubReportsRefreshPicker = populateReportsPicker;

  function setReportsGridToolsVisible(show) {
    const c = document.getElementById('reportsGridCount');
    const s = document.getElementById('reportsGridSearch');
    if (c) {
      c.style.display = show ? 'inline-flex' : 'none';
      if (!show) c.textContent = '';
    }
    if (s) {
      s.style.display = show ? '' : 'none';
      if (!show) s.value = '';
    }
  }

  function attrEscape(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /**
   * Part No / Component identifier columns — often numeric strings; must not use Indian grouping.
   * Matches common report column names (labels + SQL-style keys).
   */
  function isPartNumberColumnName(columnKey) {
    const raw = String(columnKey || '').trim();
    if (!raw) return false;
    const key = raw.toLowerCase();
    const compact = key.replace(/\s+/g, '');
    const under = key.replace(/\s+/g, '_');
    if (compact === 'partno' || under === 'part_no' || under === 'co_partno') return true;
    if (/^(co_)?part_?no$/i.test(under)) return true;
    if (/\bpart\s*#\b/i.test(key)) return true;
    if (/\bpart\s+no\.?\b/i.test(key)) return true;
    if (/\bpart\s+number\b/i.test(key)) return true;
    return false;
  }

  function isComponentIdentifierColumnName(columnKey) {
    const raw = String(columnKey || '').trim();
    if (!raw) return false;
    const key = raw.toLowerCase();
    const compact = key.replace(/\s+/g, '');
    const under = key.replace(/\s+/g, '_');
    if (/\bcomponent\s+count\b/i.test(key)) return false;
    if (/\bcomponent\s+weight\b/i.test(key)) return false;
    if (/\bno\s+of\s+comp\b/i.test(key)) return false;
    if (compact === 'component') return true;
    if (/^component\d+$/i.test(compact)) return true;
    if (compact === 'compno' || under === 'comp_no' || under === 'co_compid') return true;
    if (/^(co_)?comp(ponent)?_?id$/i.test(under)) return true;
    if (/\bcomponent\s*no\.?\b/i.test(key)) return true;
    if (/\bcomponent\s+number\b/i.test(key)) return true;
    return false;
  }

  function isIdentifierColumnName(columnKey) {
    return isPartNumberColumnName(columnKey) || isComponentIdentifierColumnName(columnKey);
  }

  /** RM conversion / grams-per-part columns — keep SQL decimal precision in the grid. */
  function isHighPrecisionColumnName(columnKey) {
    const raw = String(columnKey || '').trim();
    if (!raw) return false;
    const key = raw.toLowerCase();
    const compact = key.replace(/\s+/g, '');
    if (compact === 'rm_conval' || compact === 'rmconval') return true;
    if (compact === 'conval' || key.includes('con val') || key.includes('conval')) return true;
    if (compact === 'totalwt' || key === 'total wt') return true;
    if (key.includes('input rm')) return true;
    return false;
  }

  function numericFractionDigits(columnKey) {
    if (isHighPrecisionColumnName(columnKey)) return 10;
    return 6;
  }

  /**
   * Codes stored as numeric strings (e.g. 08124) must not pass through Number() —
   * that drops leading zeros and Indian grouping shows 8,124 instead of 08124.
   */
  function isLiteralNumericIdentifier(value) {
    if (value === null || value === undefined || value === '') return false;
    const s = String(value).trim();
    if (/^-?\d+$/.test(s) && s !== String(Number(s))) return true;
    if (/^0\d/.test(s)) return true;
    return false;
  }

  function isNoFormatColumn(columnKey) {
    if (!columnKey) return false;
    return _activeNoFormatColumns.has(String(columnKey).trim().toLowerCase());
  }

  function formatIndianValue(value, columnKey) {
    if (value === null || value === undefined || value === '') return '';
    if (columnKey && isIdentifierColumnName(columnKey)) {
      return String(value);
    }
    if (columnKey && isNoFormatColumn(columnKey)) {
      return String(value);
    }
    if (isLiteralNumericIdentifier(value)) {
      return String(value).trim();
    }
    const n = Number(value);
    if (!Number.isNaN(n) && String(value).trim() !== '') {
      const maxFrac = columnKey ? numericFractionDigits(columnKey) : 6;
      return n.toLocaleString('en-IN', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxFrac,
      });
    }
    return String(value);
  }

  function isNumericForTotal(value, columnKey) {
    if (columnKey && isIdentifierColumnName(columnKey)) return false;
    if (isLiteralNumericIdentifier(value)) return false;
    if (value === null || value === undefined || value === '') return false;
    const n = Number(value);
    return !Number.isNaN(n) && String(value).trim() !== '';
  }

  /** Sum a column only when every non-empty cell is numeric (skips blanks). */
  function columnIsSummable(columnKey, dataRows) {
    if (isIdentifierColumnName(columnKey)) return false;
    let nonEmpty = 0;
    let numeric = 0;
    dataRows.forEach(function(r) {
      const v = r[columnKey];
      if (v === null || v === undefined || String(v).trim() === '') return;
      nonEmpty++;
      if (isNumericForTotal(v, columnKey)) numeric++;
    });
    return nonEmpty > 0 && numeric === nonEmpty;
  }

  function buildReportsGrandTotalRow(dataRows, columns) {
    const keys = (columns || []).map(function(c) { return c && c.key ? c.key : c; }).filter(Boolean);
    if (!dataRows.length || !keys.length) return null;

    const row = {};
    let anySum = false;
    keys.forEach(function(key, idx) {
      if (columnIsSummable(key, dataRows)) {
        let sum = 0;
        dataRows.forEach(function(r) {
          const v = r[key];
          if (isNumericForTotal(v, key)) sum += Number(v);
        });
        row[key] = sum;
        anySum = true;
      } else {
        row[key] = idx === 0 ? 'Grand Total' : '';
      }
    });
    return anySum ? row : null;
  }

  function reportVarControlHtml(v) {
    const id = 'runVar_' + v;
    const u = v.toUpperCase();
    const ph = attrEscape(v);
    const tip = ' title="' + ph + '" aria-label="' + ph + '"';
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (u === 'MONTH' || u.endsWith('_MONTH')) {
      const cur = new Date().getMonth() + 1;
      let opts = '';
      for (let m = 1; m <= 12; m++) {
        opts += '<option value="' + m + '"' + (m === cur ? ' selected' : '') + '>' + m + ' — ' + monthNames[m - 1] + '</option>';
      }
      return '<div class="rr-var"><select class="ti-select rr-var__ctl" id="' + id + '"' + tip + '>' + opts + '</select></div>';
    }
    if (u === 'YEAR' || u === 'Y' || u.endsWith('_YEAR')) {
      const y0 = new Date().getFullYear();
      let opts = '';
      for (let y = y0 - 5; y <= y0 + 1; y++) {
        opts += '<option value="' + y + '"' + (y === y0 ? ' selected' : '') + '>' + y + '</option>';
      }
      return '<div class="rr-var"><select class="ti-select rr-var__ctl rr-var__ctl--narrow" id="' + id + '"' + tip + '>' + opts + '</select></div>';
    }
    if (u === 'WEEK' || u.endsWith('_WEEK')) {
      let opts = '';
      for (let w = 1; w <= 5; w++) {
        opts += '<option value="' + w + '">' + w + '</option>';
      }
      return '<div class="rr-var"><select class="ti-select rr-var__ctl rr-var__ctl--narrow" id="' + id + '"' + tip + '>' + opts + '</select></div>';
    }
    if (u === 'DAY' || u === 'DOM' || u === 'D') {
      return '<div class="rr-var"><input type="number" class="ti-input rr-var__ctl rr-var__ctl--narrow" id="' + id + '" min="1" max="31" placeholder="' + ph + '"' + tip + '></div>';
    }
    if ((u.includes('DATE') || u.endsWith('_DT') || u === 'AS_ON') && !u.endsWith('_MONTH') && !u.endsWith('_YEAR')) {
      const today = new Date().toISOString().slice(0, 10);
      return '<div class="rr-var"><input type="date" class="ti-input rr-var__ctl" id="' + id + '" value="' + today + '"' + tip + '></div>';
    }
    return '<div class="rr-var"><input type="text" class="ti-input rr-var__ctl" id="' + id + '" placeholder="' + ph + '" style="min-width:100px;max-width:160px"' + tip + '></div>';
  }

  function resetRunVariableInputs() {
    if (!currentRunReport) return;
    const vars = currentRunReport.variables || [];
    if (!vars.length) return;
    const varsPanel = document.getElementById('runVarsPanel');
    varsPanel.innerHTML = vars.map(reportVarControlHtml).join('');
  }

  function collectRunVariables() {
    const vars = {};
    (currentRunReport.variables || []).forEach(v => {
      const el = document.getElementById('runVar_' + v);
      if (el) vars[v] = el.value;
    });
    return vars;
  }

  function updateBackButtonState() {
    const backBtn = document.getElementById('runBackBtn');
    if (!backBtn) return;
    backBtn.style.display = runViewStack.length ? '' : 'none';
    document.getElementById('runExecuteBtn').disabled = !currentRunReport || runViewStack.length > 0;
    document.getElementById('runClearBtn').style.display = (currentRunReport && (currentRunReport.variables || []).length && runViewStack.length === 0) ? '' : 'none';
  }

  function getDrilldownsForColumn(report, columnName) {
    const list = Array.isArray(report && report.drilldowns) ? report.drilldowns : [];
    const key = String(columnName || '').trim().toLowerCase();
    return list.filter(d => d && String(d.column || '').trim().toLowerCase() === key);
  }

  function isReportsGrandTotalRow(row) {
    return !!(row && row.__sgGrandTotal);
  }

  function withDrilldownFormatters(report, resultRows, columns) {
    return columns.map(function(c) {
      const align = 'left';
      const drilldowns = getDrilldownsForColumn(report, c);
      if (!drilldowns.length) {
        return {
          key: c,
          label: c,
          align: align,
          sortable: true,
          format: function(value, row) {
            if (isReportsGrandTotalRow(row)) {
              return '<span class="sg-grand-total-cell">' + escapeHtml(formatIndianValue(value, c)) + '</span>';
            }
            return escapeHtml(formatIndianValue(value, c));
          },
        };
      }
      return {
        key: c,
        label: c,
        align: align,
        sortable: true,
        format: function(value, row) {
          if (isReportsGrandTotalRow(row)) {
            return '<span class="sg-grand-total-cell">' + escapeHtml(formatIndianValue(value, c)) + '</span>';
          }
          if (value === null || value === undefined || value === '') return '';
          const payload = encodeURIComponent(JSON.stringify({ col: c, row: row }));
          return '<button type="button" class="rr-link-btn" data-drilldown="' + payload + '" style="all:unset;color:#1565c0;cursor:pointer;text-decoration:underline">' + escapeHtml(formatIndianValue(value, c)) + '</button>';
        },
      };
    });
  }

  function bindDrilldownClicks() {
    const host = document.getElementById('runTable');
    if (!host || host.dataset.drilldownBound === '1') return;
    host.dataset.drilldownBound = '1';
    host.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-drilldown]');
      if (!btn || !currentRunReport || !lastRunResult) return;
      let parsed;
      try {
        parsed = JSON.parse(decodeURIComponent(btn.getAttribute('data-drilldown') || ''));
      } catch (_) {
        return;
      }
      const drilldowns = getDrilldownsForColumn(currentRunReport, parsed.col);
      if (!drilldowns.length) return;
      const drilldown = drilldowns[0];
      const variables = {};
      Object.entries(drilldown.variables || {}).forEach(([targetVar, sourceSpec]) => {
        let raw = '';
        if (sourceSpec && typeof sourceSpec === 'object') {
          const sourceType = sourceSpec.type === 'parentVariable' ? 'parentVariable' : 'column';
          const sourceValue = String(sourceSpec.value || '').trim();
          if (sourceType === 'parentVariable') {
            raw = (currentRunVariables || {})[sourceValue];
          } else {
            raw = parsed.row ? parsed.row[sourceValue] : '';
          }
        } else {
          const sourceCol = String(sourceSpec || '').trim();
          raw = parsed.row ? parsed.row[sourceCol] : '';
        }
        variables[targetVar] = raw === null || raw === undefined ? '' : String(raw);
      });
      const hasMissing = Object.values(variables).some(v => String(v).trim() === '');
      if (hasMissing) {
        showSnackbar('Cannot drill down: required source value is missing in selected row.');
        return;
      }
      await runDrilldown(drilldown, variables);
    });
  }

  function syncReportsGrandTotalSticky() {
    const root = document.getElementById('runTable');
    if (!root) return;
    const scroll = root.querySelector('.sg-scroll');
    const table = root.querySelector('.sg-table');
    if (!scroll || !table) return;
    const thead = table.querySelector('thead');
    const headH = thead ? Math.round(thead.getBoundingClientRect().height) : 42;
    scroll.style.setProperty('--sg-head-h', headH + 'px');
    table.querySelectorAll('tbody tr.sg-sticky-top-row td').forEach(function(td) {
      td.style.top = headH + 'px';
    });
  }

  function renderResultGrid(report, result, restoreSearchValue) {
    const runTableEl = document.getElementById('runTable');
    if (runGrid && runGrid.destroy) runGrid.destroy();
    const cols = result.columns || (result.rows && result.rows[0] ? Object.keys(result.rows[0]) : []);
    const filteredRows = applyReportsRowFilter(result.rows || []);
    updateReportsRowFilterHint();
    if (!filteredRows.length) {
      const msg = (result.rows || []).length && reportsRowFilter() === 'balance'
        ? 'No balance lines (all rows have dispatched qty = schedule qty)'
        : 'No rows returned';
      runTableEl.innerHTML = '<div class="rr-no-data">' + msg + '</div>';
      runTableEl.style.display = 'block';
      setReportsGridToolsVisible(false);
      return;
    }
    const dgCols = withDrilldownFormatters(report, filteredRows, cols);
    runTableEl.innerHTML = '';
    runTableEl.style.display = 'flex';
    setReportsGridToolsVisible(true);
    runGrid = SuperGrid.create(runTableEl, {
      columns: dgCols,
      rows: filteredRows,
      options: {
        search: true,
        omitToolbar: true,
        countElement: document.getElementById('reportsGridCount'),
        searchInputElement: document.getElementById('reportsGridSearch'),
        countLabel: 'rows',
        exportBtn: false,
        resizable: true,
        grandTotalRowFn: buildReportsGrandTotalRow,
        grandTotalPosition: 'top',
        onBodyRendered: function() {
          requestAnimationFrame(function() {
            requestAnimationFrame(syncReportsGrandTotalSticky);
          });
        },
      },
    });
    bindDrilldownClicks();
    if (typeof restoreSearchValue === 'string' && restoreSearchValue.length) {
      const searchEl = document.getElementById('reportsGridSearch');
      if (searchEl) {
        searchEl.value = restoreSearchValue;
        searchEl.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  }

  function isComponentStockReport(report) {
    return String(report?.handler || '').trim() === 'component_stock';
  }

  function setComponentStockViewerVisible(show) {
    const host = document.getElementById('runComponentStockHost');
    const gridHost = document.querySelector('.rr-grid-host');
    const runBtn = document.getElementById('runExecuteBtn');
    const exportBtn = document.getElementById('runExportBtn');
    if (host) host.style.display = show ? 'block' : 'none';
    if (gridHost) gridHost.style.display = show ? 'none' : '';
    if (runBtn) runBtn.style.display = show ? 'none' : '';
    if (exportBtn) exportBtn.style.display = show ? 'none' : '';
  }

  function showEmptyViewer() {
    currentRunReport = null;
    lastRunResult = null;
    currentRunVariables = {};
    currentViewMode = 'root';
    runViewStack.length = 0;
    setComponentStockViewerVisible(false);
    document.getElementById('runExecuteBtn').style.display = '';
    document.getElementById('runExportBtn').style.display = '';
    document.getElementById('runReportTitle').textContent = 'Reports';
    const sub = document.getElementById('runReportSub');
    sub.textContent = 'Select a report from the sidebar';
    sub.style.display = '';
    document.getElementById('runExecuteBtn').disabled = true;
    document.getElementById('runExportBtn').disabled = true;
    document.getElementById('runTable').style.display = 'none';
    document.getElementById('runTable').innerHTML = '';
    if (runGrid && runGrid.destroy) runGrid.destroy();
    runGrid = null;
    document.getElementById('runError').style.display = 'none';
    setReportsGridToolsVisible(false);
    const varsPanel = document.getElementById('runVarsPanel');
    varsPanel.style.display = 'none';
    varsPanel.innerHTML = '';
    document.getElementById('runEmpty').style.display = 'flex';
    document.getElementById('runClearBtn').style.display = 'none';
    document.getElementById('runBackBtn').style.display = 'none';
    syncReportsPicker(null);
  }

  function canAutoRunReport(report) {
    if (String(report?.handler || '').trim() === 'component_stock') return false;
    const vars = report?.variables || [];
    if (!vars.length) return true;
    return vars.every(v => {
      const u = v.toUpperCase();
      if (u === 'MONTH' || u.endsWith('_MONTH')) return true;
      if (u === 'YEAR' || u === 'Y' || u.endsWith('_YEAR')) return true;
      if (u === 'WEEK' || u.endsWith('_WEEK')) return true;
      if ((u.includes('DATE') || u.endsWith('_DT') || u === 'AS_ON') && !u.endsWith('_MONTH') && !u.endsWith('_YEAR')) return true;
      return false;
    });
  }

  function openRunReport(report) {
    currentRunReport = report;
    currentViewMode = 'root';
    runViewStack.length = 0;
    document.getElementById('runReportTitle').textContent = report.name;
    document.getElementById('runReportSub').style.display = 'none';
    updateReportsRowFilterHint();
    document.getElementById('runExecuteBtn').disabled = false;
    document.getElementById('runExportBtn').disabled = true;
    document.getElementById('runTable').style.display = 'none';
    document.getElementById('runTable').innerHTML = '';
    document.getElementById('runError').style.display = 'none';
    setReportsGridToolsVisible(false);
    lastRunResult = null;

    if (isComponentStockReport(report)) {
      setComponentStockViewerVisible(true);
      const varsPanel = document.getElementById('runVarsPanel');
      varsPanel.style.display = 'none';
      varsPanel.innerHTML = '';
      document.getElementById('runEmpty').style.display = 'none';
      document.getElementById('runClearBtn').style.display = 'none';
      document.getElementById('runExecuteBtn').disabled = true;
      updateBackButtonState();
      syncReportsPicker(report.id);
      if (typeof window.ComponentStockPage?.init === 'function') {
        window.ComponentStockPage.init();
      }
      return;
    }

    setComponentStockViewerVisible(false);
    document.getElementById('runExecuteBtn').style.display = '';
    document.getElementById('runExportBtn').style.display = '';
    document.getElementById('runClearBtn').style.display = '';

    const varsPanel = document.getElementById('runVarsPanel');
    const vars = report.variables || [];
    if (vars.length) {
      varsPanel.style.display = 'flex';
      varsPanel.innerHTML = vars.map(reportVarControlHtml).join('');
    } else {
      varsPanel.style.display = 'none';
      varsPanel.innerHTML = '';
    }

    document.getElementById('runEmpty').style.display = 'none';
    document.getElementById('runClearBtn').style.display = vars.length ? '' : 'none';
    updateBackButtonState();
    syncReportsPicker(report.id);
  }

  async function runReportExecute(customReport, providedVariables, opts) {
    const report = customReport || currentRunReport;
    const options = opts || {};
    if (!report) return;
    document.getElementById('runLoading').style.display = 'block';
    document.getElementById('runTable').style.display = 'none';
    document.getElementById('runError').style.display = 'none';
    setReportsGridToolsVisible(false);

    const vars = providedVariables || collectRunVariables();
    const rid = report.id;
    const loadEl = document.getElementById('runLoading');

    try {
      const result = await apiPost('/api/reports/reports/' + rid + '/run', { variables: vars });
      if (!report || report.id !== rid) return;
      lastRunResult = result;
      currentRunReport = report;
      currentRunVariables = { ...vars };

      if (!result.rows || !result.rows.length) {
        document.getElementById('runTable').innerHTML = '<div class="rr-no-data">No rows returned</div>';
        document.getElementById('runTable').style.display = 'block';
        setReportsGridToolsVisible(false);
        updateReportsRowFilterHint();
      } else {
        // Update the active no-format columns set before rendering
        const noFmtList = Array.isArray(result.noFormatColumns) ? result.noFormatColumns : (Array.isArray(report.noFormatColumns) ? report.noFormatColumns : []);
        _activeNoFormatColumns = new Set(noFmtList.map(c => String(c).trim().toLowerCase()));
        renderResultGrid(report, result, options.restoreSearchValue);
      }
      if (options.title) document.getElementById('runReportTitle').textContent = options.title;
      updateBackButtonState();
      document.getElementById('runExportBtn').disabled = false;
    } catch (err) {
      if (report && report.id === rid) {
        document.getElementById('runError').innerHTML = `<div class="rr-error__msg">⚠️ ${err.message}</div>`;
        document.getElementById('runError').style.display = 'block';
      }
    } finally {
      loadEl.style.display = 'none';
    }
  }

  async function runDrilldown(drilldown, variables) {
    if (!currentRunReport || !lastRunResult) return;
    document.getElementById('runError').style.display = 'none';
    try {
      const child = await apiFetch('/api/reports/reports/' + encodeURIComponent(drilldown.targetReportId));
      runViewStack.push({
        report: currentRunReport,
        result: lastRunResult,
        variables: { ...currentRunVariables },
        title: document.getElementById('runReportTitle').textContent,
        searchValue: (document.getElementById('reportsGridSearch') || {}).value || '',
      });
      currentViewMode = 'drilldown';
      const varsPanel = document.getElementById('runVarsPanel');
      varsPanel.style.display = 'none';
      varsPanel.innerHTML = '';
      updateBackButtonState();
      await runReportExecute(child, variables, { title: `${child.name}` });
    } catch (err) {
      document.getElementById('runError').innerHTML = `<div class="rr-error__msg">⚠️ ${err.message}</div>`;
      document.getElementById('runError').style.display = 'block';
    }
  }

  function goBackFromDrilldown() {
    const prev = runViewStack.pop();
    if (!prev) return;
    currentRunReport = prev.report;
    lastRunResult = prev.result;
    currentRunVariables = prev.variables || {};
    currentViewMode = runViewStack.length ? 'drilldown' : 'root';
    // Restore no-format columns for the report we're going back to
    const noFmtList = Array.isArray(prev.result && prev.result.noFormatColumns) ? prev.result.noFormatColumns : (Array.isArray(prev.report.noFormatColumns) ? prev.report.noFormatColumns : []);
    _activeNoFormatColumns = new Set(noFmtList.map(c => String(c).trim().toLowerCase()));
    document.getElementById('runReportTitle').textContent = prev.title || prev.report.name;
    document.getElementById('runReportSub').style.display = 'none';
    renderResultGrid(prev.report, prev.result, prev.searchValue || '');
    updateBackButtonState();
    document.getElementById('runExportBtn').disabled = false;
  }

  window.__hubReportsOpenReport = async function(reportId) {
    if (!reportId) {
      showEmptyViewer();
      return;
    }
    document.getElementById('runLoading').style.display = 'block';
    try {
      const report = await apiFetch('/api/reports/reports/' + encodeURIComponent(reportId));
      openRunReport(report);
      if (canAutoRunReport(report)) await runReportExecute();
    } catch (err) {
      document.getElementById('runError').innerHTML = `<div class="rr-error__msg">⚠️ ${err.message || 'Failed to load report'}</div>`;
      document.getElementById('runError').style.display = 'block';
      document.getElementById('runEmpty').style.display = 'none';
    }
    document.getElementById('runLoading').style.display = 'none';
  };

  document.getElementById('runClearBtn').addEventListener('click', () => {
    resetRunVariableInputs();
  });

  document.getElementById('reportsRunnerPicker').addEventListener('change', function() {
    if (pickerIgnoreChange) return;
    const v = this.value;
    if (window.Hub && typeof Hub.navigate === 'function') Hub.navigate('reports', { reportId: v || null });
    else if (!v) showEmptyViewer();
    else window.__hubReportsOpenReport(v);
  });

  document.getElementById('runExecuteBtn').addEventListener('click', () => runReportExecute());
  document.getElementById('runBackBtn').addEventListener('click', () => goBackFromDrilldown());

  document.getElementById('runExportBtn').addEventListener('click', async () => {
    if (!currentRunReport || !lastRunResult) return;
    const vars = (runViewStack.length > 0 || currentViewMode === 'drilldown') ? currentRunVariables : collectRunVariables();
    try {
      await apiDownload('/api/reports/reports/' + currentRunReport.id + '/export', { variables: vars }, currentRunReport.name + '.xlsx');
    } catch (err) { showSnackbar(err.message); }
  });

  populateReportsPicker().then(() => {
    const params = new URLSearchParams(window.location.search);
    const rid = params.get('report');
    if (rid) window.__hubReportsOpenReport(rid);
    else showEmptyViewer();
  });
})();
</script>
