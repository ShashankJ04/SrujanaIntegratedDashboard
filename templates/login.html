<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login - Data Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css', v='corp-v2') }}"
    />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <img
            class="login-logo"
            src="{{ url_for('static', filename='images/side-logo.png') }}"
            alt="Logo"
          />
          <h1 class="login-title">Data Dashboard</h1>
          <p class="login-subtitle">Sign in to continue</p>
        </div>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <form class="login-form" method="POST" action="{{ url_for('login') }}">
          {% if next_url %}
          <input type="hidden" name="next" value="{{ next_url }}" />
          {% endif %}
          <div class="form-group">
            <label for="login" class="form-label">Username</label>
            <input
              type="text"
              id="login"
              name="login"
              class="form-input"
              placeholder="Enter your username"
              required
              autofocus
            />
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit" class="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  </body>
</html>
